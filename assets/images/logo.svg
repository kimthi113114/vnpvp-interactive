<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="vnpvp-grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="vnpvp-grad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Hexagon Frame -->
  <polygon points="50,6 88,28 88,72 50,94 12,72 12,28" 
           stroke="url(#vnpvp-grad1)" stroke-width="2.5" fill="#090d16" fill-opacity="0.85" filter="url(#glow)" />
  
  <!-- Isometric Inner Cube / Forge -->
  <!-- Top Face -->
  <polygon points="50,22 74,36 50,50 26,36" fill="url(#vnpvp-grad1)" fill-opacity="0.9" />
  <!-- Left Face -->
  <polygon points="26,36 50,50 50,78 26,64" fill="url(#vnpvp-grad2)" fill-opacity="0.75" />
  <!-- Right Face -->
  <polygon points="50,50 74,36 74,64 50,78" fill="#4f46e5" fill-opacity="0.85" />

  <!-- Center Energy Core -->
  <circle cx="50" cy="50" r="4.5" fill="#ffffff" filter="url(#glow)" />

  <!-- Code / Dev Brackets subtle imprint in top face -->
  <path d="M 43 32 L 39 36 L 43 40" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 57 32 L 61 36 L 57 40" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="52" y1="31" x2="48" y2="41" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>

  <!-- Orbital Node Accents -->
  <circle cx="50" cy="6" r="3" fill="#38bdf8" />
  <circle cx="88" cy="28" r="3" fill="#6366f1" />
  <circle cx="88" cy="72" r="3" fill="#a855f7" />
  <circle cx="50" cy="94" r="3" fill="#ec4899" />
  <circle cx="12" cy="72" r="3" fill="#06b6d4" />
  <circle cx="12" cy="28" r="3" fill="#3b82f6" />
</svg>
